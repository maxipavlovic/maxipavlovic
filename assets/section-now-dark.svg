<svg xmlns="http://www.w3.org/2000/svg" width="840" height="72" viewBox="0 0 840 72" role="img" aria-label="02 NOW SHIPPING"><title>02 NOW SHIPPING</title><style>svg{--paper:#0b0b0a;--lit:#181816;--ink:#ecebe6;--ink2:#aaa8a0;--rule:#d9d8d2;--rule2:#55544e;--sig:#ff6a2b;--sigink:#ff8a55;--hw:1}@font-face{font-family:F-label;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:F-mono;src:url(data:font/woff2;base64,) format('woff2')}
